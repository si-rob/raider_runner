<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RAIDER RUNNER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
    background: #0a0800;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: 'Courier New', monospace;
}
#wrap { position: relative; user-select: none; }
canvas {
    display: block;
    touch-action: none;
    /* fill viewport while keeping 16:9 — no hard desktop cap */
    width: min(100vw, calc(100svh * 1.7778));
    height: auto;
    max-height: 100svh;
    image-rendering: pixelated;
}
#crt {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
        transparent 0px, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
}
#rotate-hint {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,8,0,0.95);
    color: #00ff44;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    font-family: 'Courier New', monospace;
    text-align: center;
    z-index: 99;
    letter-spacing: 0.1em;
    pointer-events: none;
}
#rotate-hint .rh-icon { font-size: 3.5rem; line-height: 1; }
#rotate-hint .rh-text { font-size: 0.9rem; line-height: 1.9; text-transform: uppercase; }
@media (max-width: 600px) and (orientation: portrait) {
    #rotate-hint { display: flex; }
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div id="crt"></div>
</div>
<div id="rotate-hint">
    <div class="rh-icon">&#x21BA;</div>
    <div class="rh-text">Rotate device<br>for best experience</div>
</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 450, GROUND = 370;
const GRAVITY = 0.58;
const VAULT_ITEM_H = 52;
const VAULT_ITEMS_VISIBLE = 4;

// ── Input ──────────────────────────────────────────────────────────────
const keys = {}, pressed = {};
addEventListener('keydown', e => {
    if (!keys[e.code]) pressed[e.code] = true;
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ── Gamepad API ────────────────────────────────────────────────────────
const gpPrev = {};
function pollGamepad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[0];
    if (!gp) return;
    const b = i => gp.buttons[i]?.pressed ?? false;
    const ax = gp.axes;
    // Held movement keys
    keys['ArrowLeft']  = b(14) || (ax[0]??0) < -0.3;
    keys['ArrowRight'] = b(15) || (ax[0]??0) >  0.3;
    keys['ArrowDown']  = b(13) || (ax[1]??0) >  0.5;
    keys['Space']      = b(0)  || b(12);          // A or DPad-Up = jump
    // Single-press actions
    const shootNow   = b(5) || (gp.buttons[7]?.value??0) > 0.5;
    const vatsNow    = b(3);
    const cycleWpnNow= b(4);
    const execNow    = b(9);
    const enterNow   = b(1);
    const navUpNow   = b(12);
    const navDnNow   = b(13) || (ax[1]??0) > 0.5;
    if (shootNow    && !gpPrev.shoot)    pressed['KeyZ']      = true;
    if (vatsNow     && !gpPrev.vats)     pressed['KeyV']      = true;
    if (cycleWpnNow && !gpPrev.cycleWpn) pressed['KeyQ']      = true;
    if (execNow     && !gpPrev.exec)     pressed['Enter']     = true;
    if (enterNow    && !gpPrev.enter)    pressed['KeyE']      = true;
    if (navUpNow    && !gpPrev.navUp)    pressed['ArrowUp']   = true;
    if (navDnNow    && !gpPrev.navDn)    pressed['ArrowDown'] = true;
    gpPrev.shoot    = shootNow;  gpPrev.vats     = vatsNow;
    gpPrev.cycleWpn = cycleWpnNow;
    gpPrev.exec     = execNow;   gpPrev.enter    = enterNow;
    gpPrev.navUp    = navUpNow;  gpPrev.navDn    = navDnNow;
}

// ── Touch virtual controls ─────────────────────────────────────────────
const TB = {
    left:   { x: 52,  y: 378, r: 38, label: '◀',    key: 'ArrowLeft',  action: false },
    right:  { x: 136, y: 378, r: 38, label: '▶',    key: 'ArrowRight', action: false },
    crouch: { x: 94,  y: 424, r: 30, label: '▼',    key: 'ArrowDown',  action: false },
    jump:   { x: 750, y: 365, r: 42, label: 'JUMP',  key: 'Space',     action: false },
    shoot:  { x: 692, y: 418, r: 34, label: 'FIRE',  key: 'KeyZ',      action: true  },
    vats:   { x: 638, y: 370, r: 30, label: 'VATS',  key: 'KeyV',      action: true  },
};
const TB_ENTER = { x: W/2, y: 355, r: 36, label: 'ENTER\nVAULT', key: 'KeyE', action: true };
const activeTouches = new Map();
function getHitBtn(cx, cy, vaultInteractive) {
    const all = [...Object.values(TB), ...(vaultInteractive ? [TB_ENTER] : [])];
    for (const btn of all) {
        const dx = cx-btn.x, dy = cy-btn.y;
        if (dx*dx+dy*dy <= btn.r*btn.r) return btn;
    }
    return null;
}
function touchCoords(t) {
    const r = canvas.getBoundingClientRect();
    return { x: (t.clientX-r.left)*W/r.width, y: (t.clientY-r.top)*H/r.height };
}
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const curState = typeof state !== 'undefined' ? state : 'title';
    // Title / dead — any tap starts or restarts
    if (curState === 'title' || curState === 'dead') {
        pressed['Space'] = true;
        return;
    }
    // Vault — tap items or exit door
    if (curState === 'vault') {
        for (const t of e.changedTouches) {
            const {x,y} = touchCoords(t);
            const px=148, py=86, pw=W-px-12;
            for (let vi=0; vi<VAULT_ITEMS_VISIBLE; vi++) {
                const i = (typeof vaultScrollOffset!=='undefined'?vaultScrollOffset:0) + vi;
                if(i>=SHOP_ITEMS.length)break;
                const iy = py+40+vi*VAULT_ITEM_H;
                if (x>=px+6 && x<=px+pw-6 && y>=iy-2 && y<=iy+VAULT_ITEM_H-2) { buyShopItem(i); break; }
            }
            // Exit door area
            if (x>=8 && x<=70 && y>=GROUND-96 && y<=GROUND+4) pressed['Escape'] = true;
        }
        return;
    }
    // Playing — virtual buttons
    const vi = typeof vaultDoors!=='undefined' && vaultDoors.some(v=>v.interactive);
    for (const t of e.changedTouches) {
        const {x,y} = touchCoords(t);
        const btn = getHitBtn(x, y, vi);
        if (btn) {
            activeTouches.set(t.identifier, btn.key);
            keys[btn.key] = true;
            if (btn.action) pressed[btn.key] = true;
        }
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        const k = activeTouches.get(t.identifier);
        if (k) { keys[k] = false; activeTouches.delete(t.identifier); }
    }
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
        const k = activeTouches.get(t.identifier);
        if (k) { keys[k] = false; activeTouches.delete(t.identifier); }
    }
});
const isTouchDevice = () => 'ontouchstart' in window || navigator.maxTouchPoints > 0;
function drawTouchControls(ctx, vaultInteractive) {
    if (!isTouchDevice()) return;
    ctx.save();
    const activeKeys = new Set(activeTouches.values());
    const drawBtn = (btn, accent) => {
        const on = activeKeys.has(btn.key);
        const col = accent || '#00ff44';
        ctx.globalAlpha = on ? 0.95 : 0.55;
        // Shadow glow when active
        if (on) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
        ctx.fillStyle = on ? `rgba(0,60,20,0.7)` : 'rgba(0,0,0,0.6)';
        ctx.fill();
        ctx.strokeStyle = on ? col : 'rgba(0,255,80,0.4)';
        ctx.lineWidth = on ? 2.5 : 1.5;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = on ? col : 'rgba(0,255,80,0.75)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const lines = btn.label.split('\n');
        const fs = Math.round(btn.r * (lines.length > 1 ? 0.38 : 0.48));
        ctx.font = `bold ${fs}px Courier New`;
        lines.forEach((l,i) => ctx.fillText(l, btn.x, btn.y + (i-(lines.length-1)/2) * (fs+3)));
    };
    // Movement buttons (left side) — blue tint
    drawBtn(TB.left);  drawBtn(TB.right); drawBtn(TB.crouch);
    // Action buttons (right side) — colour-coded
    drawBtn(TB.jump,   '#44aaff');   // blue = jump
    drawBtn(TB.shoot,  '#ff6622');   // orange = fire
    drawBtn(TB.vats,   '#ffcc00');   // yellow = VATS
    if (vaultInteractive) drawBtn(TB_ENTER, '#00ff88');
    ctx.globalAlpha = 1;
    ctx.restore();
}

// ── Helpers ────────────────────────────────────────────────────────────
const rand  = (a,b) => Math.random()*(b-a)+a;
const rInt  = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));

// ── 8-bit Sound ────────────────────────────────────────────────────────
let audioCtx = null;
let silencerTicks = 0; // gun sounds muted while > 0
function ac() {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    return audioCtx;
}
function sfxShoot() {
    if (silencerTicks > 0) return;
    try {
        const a = ac();
        // Sharp crack — noise burst + low body thud
        const sz = Math.floor(a.sampleRate * 0.06);
        const buf = a.createBuffer(1, sz, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / sz, 2);
        const src = a.createBufferSource(), g = a.createGain();
        const hi = a.createBiquadFilter(); hi.type = 'highpass'; hi.frequency.value = 1800;
        src.buffer = buf; src.connect(hi); hi.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(0.45, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.06);
        src.start(); src.stop(a.currentTime + 0.06);
    } catch(e) {}
}
function sfxEnemyShoot() {
    if (silencerTicks > 0) return;
    try {
        const a = ac();
        const sz = Math.floor(a.sampleRate * 0.08);
        const buf = a.createBuffer(1, sz, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / sz, 2.5);
        const src = a.createBufferSource(), g = a.createGain();
        const lo = a.createBiquadFilter(); lo.type = 'lowpass'; lo.frequency.value = 2200;
        src.buffer = buf; src.connect(lo); lo.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(0.28, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.08);
        src.start(); src.stop(a.currentTime + 0.08);
    } catch(e) {}
}
function sfxHitEnemy() {
    try {
        const a=ac(),sz=Math.floor(a.sampleRate*0.04);
        const buf=a.createBuffer(1,sz,a.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<sz;i++) d[i]=Math.random()*2-1;
        const src=a.createBufferSource(),g=a.createGain(),flt=a.createBiquadFilter();
        flt.type='bandpass';flt.frequency.value=1200;flt.Q.value=0.8;
        src.buffer=buf;src.connect(flt);flt.connect(g);g.connect(a.destination);
        g.gain.setValueAtTime(0.25,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.05);
        src.start();src.stop(a.currentTime+0.05);
    }catch(e){}
}
function sfxKill() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(180,a.currentTime);
        o.frequency.exponentialRampToValueAtTime(900,a.currentTime+0.18);
        g.gain.setValueAtTime(0.22,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.2);
        o.start();o.stop(a.currentTime+0.2);
    }catch(e){}
}
function sfxPlayerHit() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='sawtooth';
        o.frequency.setValueAtTime(140,a.currentTime);
        o.frequency.setValueAtTime(90,a.currentTime+0.06);
        g.gain.setValueAtTime(0.28,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);
        o.start();o.stop(a.currentTime+0.18);
    }catch(e){}
}
function sfxSquish() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='sine';
        o.frequency.setValueAtTime(300,a.currentTime);
        o.frequency.exponentialRampToValueAtTime(60,a.currentTime+0.12);
        g.gain.setValueAtTime(0.35,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);
        o.start();o.stop(a.currentTime+0.15);
    }catch(e){}
}
function sfxVATS() {
    try {
        const a=ac();
        for(let i=0;i<3;i++){
            const o=a.createOscillator(),g=a.createGain();
            o.connect(g);g.connect(a.destination);o.type='square';
            const t=a.currentTime+i*0.08;
            o.frequency.setValueAtTime(440+i*220,t);
            g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
            o.start(t);o.stop(t+0.07);
        }
    }catch(e){}
}
function sfxVATSExecute() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(660,a.currentTime);
        o.frequency.exponentialRampToValueAtTime(1320,a.currentTime+0.1);
        g.gain.setValueAtTime(0.2,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);
        o.start();o.stop(a.currentTime+0.15);
    }catch(e){}
}
function sfxPickup() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(523,a.currentTime);
        o.frequency.setValueAtTime(784,a.currentTime+0.06);
        o.frequency.setValueAtTime(1047,a.currentTime+0.12);
        g.gain.setValueAtTime(0.18,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.22);
        o.start();o.stop(a.currentTime+0.22);
    }catch(e){}
}
function sfxDie() {
    try {
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(600,a.currentTime);
        o.frequency.exponentialRampToValueAtTime(40,a.currentTime+0.7);
        g.gain.setValueAtTime(0.3,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.75);
        o.start();o.stop(a.currentTime+0.75);
    }catch(e){}
}

// ── Screen shake ───────────────────────────────────────────────────────
let shakeX=0,shakeY=0,shakeMag=0;
function addShake(m){shakeMag=Math.max(shakeMag,m);}
function tickShake(){
    if(shakeMag>0.15){shakeX=rand(-shakeMag,shakeMag);shakeY=rand(-shakeMag,shakeMag);shakeMag*=0.78;}
    else{shakeX=shakeY=shakeMag=0;}
}

// ── Particles ──────────────────────────────────────────────────────────
class Particle{
    constructor(x,y,vx,vy,color,life,size){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy;
        this.color=color;this.life=this.maxLife=life;
        this.size=size??rand(2,5);
    }
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.22;this.vx*=0.94;this.life--;}
    get alive(){return this.life>0;}
    draw(ctx){
        ctx.globalAlpha=Math.max(0,this.life/this.maxLife)*0.92;
        ctx.fillStyle=this.color;
        const s=this.size*(this.life/this.maxLife);
        ctx.fillRect(this.x-s/2,this.y-s/2,s,s);
        ctx.globalAlpha=1;
    }
}

// ── Bullet ─────────────────────────────────────────────────────────────
class Bullet{
    constructor(x,y,vx,owner,color,vy){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy??0;
        this.owner=owner;this.dead=false;this.color=color??null;
        this.w=10;this.h=3;this.trail=[];
    }
    update(){
        this.trail.push({x:this.x,y:this.y});
        if(this.trail.length>6)this.trail.shift();
        this.x+=this.vx;this.y+=this.vy;
        if(this.x<-30||this.x>W+30||this.y<0||this.y>H+20)this.dead=true;
    }
    draw(ctx){
        const col=this.color||(this.owner==='player'?'#ffcc00':'#ff4400');
        const col2=this.color||(this.owner==='player'?'#ffe060':'#ff6600');
        for(let i=0;i<this.trail.length;i++){
            const t=i/this.trail.length;
            ctx.globalAlpha=t*0.35;
            ctx.fillStyle=col;
            ctx.fillRect(this.trail[i].x,this.trail[i].y,this.w*t,this.h);
        }
        ctx.globalAlpha=1;
        ctx.fillStyle=col2;
        ctx.fillRect(this.x,this.y-1,this.w,this.h+2);
        ctx.fillStyle='#ffffffcc';ctx.fillRect(this.x+2,this.y,this.w-4,1);
    }
    get rect(){return{x:this.x,y:this.y-1,w:this.w,h:this.h+2};}
}

// ── Drawing helpers ────────────────────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function draw10mm(ctx,x,y){
    ctx.fillStyle='#444';ctx.fillRect(x,y-2,13,4);
    ctx.fillStyle='#333';ctx.fillRect(x-2,y-5,10,8);
    ctx.fillStyle='#3a2010';ctx.fillRect(x+1,y+2,6,6);
    ctx.fillStyle='#555';ctx.fillRect(x+10,y-3,3,2);
}

// ── T-51 Power Armor ───────────────────────────────────────────────────
function drawT51(ctx,cx,fy,facing,runFrame,running,airborne){
    ctx.save();
    if(facing===-1){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    ctx.fillStyle='#303840';
    ctx.fillRect(cx-13,fy-9,12,9);ctx.fillRect(cx+2,fy-9,13,9);
    ctx.fillStyle='#222a30';
    ctx.fillRect(cx-14,fy-4,13,4);ctx.fillRect(cx+2,fy-4,14,4);
    const sw=running?Math.sin(runFrame*Math.PI/2)*10:0;
    const offL=airborne?9:sw*0.5,offR=airborne?-5:-sw*0.5;
    ctx.fillStyle='#4a5a6a';
    ctx.fillRect(cx-13,fy-28+offL,11,19);ctx.fillRect(cx+2,fy-28+offR,11,19);
    ctx.fillStyle='#607080';
    ctx.fillRect(cx-14,fy-32,13,7);ctx.fillRect(cx+1,fy-32,13,7);
    ctx.fillStyle='#4a5a6a';
    ctx.fillRect(cx-12,fy-50+sw*0.2,11,20);ctx.fillRect(cx+2,fy-50-sw*0.2,11,20);
    ctx.fillStyle='#384858';ctx.fillRect(cx-14,fy-52,28,6);
    ctx.fillStyle='#4a5a6a';
    roundRect(ctx,cx-16,fy-68,32,18,4);ctx.fill();
    ctx.fillStyle='#5a6a7a';
    roundRect(ctx,cx-12,fy-66,24,16,3);ctx.fill();
    ctx.fillStyle='#384858';ctx.fillRect(cx-12,fy-58,24,3);
    ctx.fillStyle='#002200';ctx.fillRect(cx-5,fy-64,10,7);
    ctx.fillStyle='#00ee55';ctx.fillRect(cx-4,fy-63,8,5);
    ctx.globalAlpha=0.32;ctx.fillStyle='#00ff66';ctx.fillRect(cx-7,fy-66,14,11);ctx.globalAlpha=1;
    ctx.fillStyle='#5a6a7a';
    roundRect(ctx,cx-26,fy-70,15,13,4);ctx.fill();
    roundRect(ctx,cx+11,fy-70,15,13,4);ctx.fill();
    ctx.fillStyle='#384858';
    ctx.fillRect(cx-26,fy-63,15,3);ctx.fillRect(cx+11,fy-63,15,3);
    ctx.fillStyle='#4a5a6a';
    ctx.fillRect(cx-24,fy-66,9,22);ctx.fillRect(cx+15,fy-66,9,22);
    ctx.fillStyle='#384858';
    ctx.fillRect(cx-24,fy-54,9,4);ctx.fillRect(cx+15,fy-54,9,4);
    ctx.fillStyle='#303840';ctx.fillRect(cx+15,fy-46,9,6);
    draw10mm(ctx,cx+22,fy-46);
    ctx.fillStyle='#4a5a6a';
    roundRect(ctx,cx-14,fy-84,28,18,6);ctx.fill();
    ctx.fillStyle='#5a6a7a';
    roundRect(ctx,cx-12,fy-84,24,9,3);ctx.fill();
    ctx.fillStyle='#384858';
    ctx.fillRect(cx-14,fy-75,8,11);ctx.fillRect(cx+6,fy-75,8,11);

// ── Vault Door (world prop) ────────────────────────────────────────────
function drawVaultDoor(ctx,x,y,interactive,t){
    const w=70,h=110;
    // Frame (concrete surround)
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x-8,y-8,w+16,h+16);
    ctx.fillStyle='#2a2a2a';ctx.fillRect(x-4,y-4,w+8,h+8);
    // Door face
    const g=ctx.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,'#5a6070');g.addColorStop(0.5,'#7a8090');g.addColorStop(1,'#4a5060');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    // Concentric ring detail
    for(let r=8;r<=30;r+=8){
        ctx.strokeStyle='#384858';ctx.lineWidth=3;
        ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,r,r,0,0,Math.PI*2);ctx.stroke();
    }
    // Wheel/handle
    ctx.fillStyle='#888';
    ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,12,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';
    ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,6,6,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#999';ctx.lineWidth=3;
    const rot=t*0.01;
    for(let i=0;i<4;i++){
        const a=i*Math.PI/2+rot;
        ctx.beginPath();ctx.moveTo(x+w/2,y+h/2);
        ctx.lineTo(x+w/2+Math.cos(a)*10,y+h/2+Math.sin(a)*10);ctx.stroke();
    }
    // Vault number
    ctx.fillStyle='#ffcc00';ctx.font='bold 11px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('VAULT',x+w/2,y+14);ctx.fillText('101',x+w/2,y+26);
    // Warning stripe at bottom
    ctx.fillStyle='#ffcc00';
    for(let i=0;i<w;i+=16){
        ctx.fillStyle=(Math.floor(i/8)%2)?'#ffcc00':'#222';
        ctx.fillRect(x+i,y+h-12,8,12);
    }
    // Light indicator
    const pulse=Math.sin(t*0.08)*0.5+0.5;
    ctx.fillStyle=interactive?`rgba(0,255,80,${0.5+pulse*0.5})`:'rgba(255,80,0,0.4)';
    ctx.beginPath();ctx.ellipse(x+w-8,y+8,5,5,0,0,Math.PI*2);ctx.fill();
    // Interact hint
    if(interactive){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        roundRect(ctx,x-10,y-34,w+20,22,4);ctx.fill();
        ctx.fillStyle='#3f3';ctx.font='bold 11px Courier New';
        ctx.fillText('[↑/SPACE] ENTER VAULT',x+w/2,y-23);
    }
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ── Vault interior ─────────────────────────────────────────────────────
const ALLY_DIALOGUES = [
    ["STRANGER!", "CLOSE THAT DOOR — RADS ARE LEAKING!"],
    ["You look rough.", "Want me to patch you up?"],
    ["I heard the world", "is gone. Is it true?"],

function drawVaultInterior(ctx,frame){
    // Room background

    ctx.fillStyle='#00ff88';ctx.font='bold 16px Courier New';

    drawAlly(ctx,72,GROUND,'doctor',frame,ALLY_DIALOGUES[1]);

    // Shop panel
    const px=148,py=86,pw=W-px-12,ph=GROUND-py-26;
    ctx.fillStyle='rgba(0,0,0,0.72)';roundRect(ctx,px,py,pw,ph,8);ctx.fill();
    ctx.strokeStyle='#3f3';ctx.lineWidth=1.5;roundRect(ctx,px,py,pw,ph,8);ctx.stroke();
    ctx.fillStyle='#3f3';ctx.font='bold 10px Courier New';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('ITEMS FOR SALE',px+14,py+9);
    ctx.strokeStyle='#2a4a2a';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px+10,py+24);ctx.lineTo(px+pw-10,py+24);ctx.stroke();

    // Scroll indicators
    if(vaultScrollOffset>0){ctx.fillStyle='#00ff88';ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('▲  SCROLL UP  ▲',px+pw/2,py+28);}
    for(let vi=0;vi<VAULT_ITEMS_VISIBLE;vi++){
        const i=vaultScrollOffset+vi;
        if(i>=SHOP_ITEMS.length)break;
        const item=SHOP_ITEMS[i];
        const iy=py+40+vi*VAULT_ITEM_H;
        const sel=(vaultSelected===i);
        const afford=caps>=item.cost;
        const isEquipped=item.weaponIdx!==undefined&&currentWeaponIdx===item.weaponIdx;
        const isOwned=item.oneTime;
        const unavail=isEquipped||isOwned;
        if(sel){
            ctx.fillStyle='rgba(0,255,80,0.13)';
            roundRect(ctx,px+6,iy-2,pw-12,48,4);ctx.fill();
            ctx.strokeStyle='#00ff44';ctx.lineWidth=1.5;
            roundRect(ctx,px+6,iy-2,pw-12,48,4);ctx.stroke();
        }
        ctx.fillStyle=unavail?'#3a6a3a':sel?'#00ff44':afford?'#ffcc00':'#555';
        ctx.font='bold 12px Courier New';ctx.textAlign='left';ctx.textBaseline='top';

        ctx.fillStyle=unavail?'#2a4a2a':afford?'#7a9':'#444';ctx.font='9px Courier New';

            ctx.fillStyle='#00ff44';ctx.font='bold 10px Courier New';

        }else{

    // Purchase message
    if(vaultMsgTimer>0){

        ctx.font='bold 13px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(vaultMsg,W/2,GROUND-18);
        ctx.globalAlpha=1;
    }

    // Exit door (left)
    ctx.fillStyle='#384858';ctx.fillRect(10,GROUND-90,55,90);

    ctx.fillStyle='#3f3';ctx.font='bold 9px Courier New';
    ctx.textAlign='center';ctx.textBaseline='bottom';

    // Controls hint
    ctx.fillStyle='rgba(0,255,80,0.45)';ctx.font='10px Courier New';
    ctx.textBaseline='bottom';
    ctx.fillText('[↑↓/D-PAD] SELECT  ·  [ENTER/A] BUY  ·  [1-8] DIRECT BUY  ·  [ESC/B] EXIT',W/2,H-4);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ── Background ─────────────────────────────────────────────────────────
function drawBG(ctx,scroll){
    const sky=ctx.createLinearGradient(0,0,0,GROUND);
    sky.addColorStop(0,'#100a04');sky.addColorStop(0.4,'#3a1c08');
    sky.addColorStop(0.75,'#6a2e10');sky.addColorStop(1,'#8b4518');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
    const mp=scroll*0.08;ctx.fillStyle='#220e04';
    for(let i=0;i<10;i++){
        const mx=((i*145-mp)%1450+1450)%1450;
        const mh=55+(i*43%55);
        ctx.beginPath();ctx.moveTo(mx,GROUND);ctx.lineTo(mx+72,GROUND-mh);ctx.lineTo(mx+145,GROUND);ctx.fill();
    }
    const bp=scroll*0.28;
    const bldgs=[{o:0,w:55,h:115},{o:90,w:38,h:78},{o:165,w:72,h:148},{o:300,w:48,h:95},{o:400,w:68,h:128},{o:520,w:44,h:88},{o:610,w:88,h:158},{o:770,w:52,h:105},{o:880,w:62,h:138}];
    const rep=1050;
    for(const b of bldgs){
        const bx=((b.o-bp%rep)%rep+rep)%rep;
        ctx.fillStyle='#2c1a0a';ctx.fillRect(bx,GROUND-b.h,b.w,b.h);
        ctx.fillStyle='rgba(255,200,50,0.1)';
        for(let wy=GROUND-b.h+10;wy<GROUND-12;wy+=18)
            for(let wx=bx+5;wx<bx+b.w-5;wx+=14)
                if((Math.floor(wx/14+b.o)+Math.floor(wy/18))%3!==0)ctx.fillRect(wx,wy,8,10);
    }
    const haze=ctx.createLinearGradient(0,GROUND-60,0,GROUND);
    haze.addColorStop(0,'transparent');haze.addColorStop(1,'rgba(120,60,10,0.25)');
    ctx.fillStyle=haze;ctx.fillRect(0,GROUND-60,W,60);
    const grd=ctx.createLinearGradient(0,GROUND,0,H);
    grd.addColorStop(0,'#5a3a1e');grd.addColorStop(0.3,'#4a2e12');grd.addColorStop(1,'#38200c');
    ctx.fillStyle=grd;ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.strokeStyle='#3a2410';ctx.lineWidth=1.5;
    const cp=scroll*0.9;
    for(let i=0;i<12;i++){
        const cx2=((i*80-cp)%(W+80)+W+80)%(W+80);
        ctx.beginPath();ctx.moveTo(cx2,GROUND+4);ctx.lineTo(cx2+20,GROUND+14);ctx.lineTo(cx2+8,GROUND+22);ctx.stroke();
    }
    ctx.fillStyle='#3e2810';const rp=scroll*0.85;
    for(let i=0;i<16;i++){
        const rx=((i*63-rp)%(W+60)+W+60)%(W+60);
        ctx.fillRect(rx,GROUND+4+(i*11%18),8+(i*7%18),4+(i*3%7));
    }
    const tp=scroll*0.6;ctx.strokeStyle='#251408';ctx.lineWidth=3;
    for(let i=0;i<7;i++){
        const tx=((i*160-tp)%(W+160)+W+160)%(W+160);
        ctx.beginPath();ctx.moveTo(tx,GROUND);ctx.lineTo(tx,GROUND-62);ctx.stroke();
        ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(tx,GROUND-46);ctx.lineTo(tx-22,GROUND-68);ctx.stroke();
        ctx.beginPath();ctx.moveTo(tx,GROUND-40);ctx.lineTo(tx+20,GROUND-60);ctx.stroke();
        ctx.beginPath();ctx.moveTo(tx,GROUND-56);ctx.lineTo(tx-14,GROUND-70);ctx.stroke();
        ctx.lineWidth=3;
    }
}

// ── HP Bar ─────────────────────────────────────────────────────────────
function drawHPBar(ctx,x,y,w,hp,max){
    if(hp>=max)return;
    ctx.fillStyle='#330000';ctx.fillRect(x,y,w,4);
    const pct=hp/max;
    ctx.fillStyle=pct>0.5?'#22cc22':pct>0.25?'#ccaa00':'#cc2200';
    ctx.fillRect(x,y,w*pct,4);
}

// ── Player ─────────────────────────────────────────────────────────────
class Player{
    constructor(){
        this.x=140;this.y=GROUND-64;this.w=34;this.h=64;
        this.vx=0;this.vy=0;this.hp=100;this.maxHp=100;
        this.onGround=false;this.crouching=false;this.facing=1;
        this.shootCD=0;this.runFrame=0;this.runTimer=0;
        this.hitFlash=0;this.dead=false;this.deathSoundPlayed=false;
    }
    get cx(){return this.x+this.w/2;}
    get cy(){return this.y+this.h/2;}
    update(bullets){
        const spd=3.8;
        const crouching=(keys['ArrowDown']||keys['KeyS'])&&this.onGround;
        this.crouching=crouching;
        const newH=crouching?44:64;
        if(this.h!==newH){this.y+=this.h-newH;this.h=newH;}
        if(!crouching){
            if(keys['ArrowLeft']||keys['KeyA']){this.vx=-spd;this.facing=-1;}
            else if(keys['ArrowRight']||keys['KeyD']){this.vx=spd;this.facing=1;}
            else this.vx=0;
        }else{this.vx*=0.7;}
        if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&this.onGround&&!crouching){
            this.vy=-13.5;this.onGround=false;
        }
        this.vy+=GRAVITY;this.x+=this.vx;this.y+=this.vy;
        this.x=clamp(this.x,10,W-this.w-10);
        if(this.y+this.h>=GROUND){this.y=GROUND-this.h;this.vy=0;this.onGround=true;}
        else this.onGround=false;
        if(this.vx!==0&&this.onGround){
            this.runTimer++;if(this.runTimer%7===0)this.runFrame=(this.runFrame+1)%4;
        }else if(this.onGround){this.runFrame=0;this.runTimer=0;}
        if(this.shootCD>0)this.shootCD--;
        const wantShoot=pressed['KeyZ']||pressed['KeyX']||pressed['ControlLeft']||pressed['ControlRight'];
        if(wantShoot&&this.shootCD===0){
            const wpn=WEAPONS[currentWeaponIdx];
            const bx=this.facing===1?this.x+this.w+8:this.x-18;
            const by=this.y+(crouching?this.h*0.62:this.h*0.56);
            for(let p=0;p<wpn.pellets;p++){
                const vy=wpn.pellets>1?(p-(wpn.pellets-1)/2)*wpn.spread:0;
                bullets.push(new Bullet(bx,by,this.facing*wpn.spd,'player',wpn.bcolor,vy));
            }
            this.shootCD=wpn.cd;sfxShoot();
        }
        if(this.hitFlash>0)this.hitFlash--;
    }
    takeDamage(dmg,particles){
        if(this.hitFlash>0)return;
        this.hp=Math.max(0,this.hp-dmg);this.hitFlash=22;sfxPlayerHit();
        for(let i=0;i<8;i++)particles.push(new Particle(this.cx,this.cy,rand(-4,4),rand(-5,1),'#ff4444',rInt(20,40)));
        if(this.hp<=0)this.dead=true;
    }
    draw(ctx){
        ctx.save();
        if(this.hitFlash>0&&Math.floor(this.hitFlash/3)%2===0)ctx.filter='brightness(4) saturate(0)';
        const pcx=Math.round(this.x+this.w/2),pfy=Math.round(this.y+this.h);
        if(this.crouching)drawT51Crouch(ctx,pcx,pfy,this.facing);
        else drawT51(ctx,pcx,pfy,this.facing,this.runFrame,this.onGround&&this.vx!==0,!this.onGround);
        ctx.restore();
    }
    get rect(){return{x:this.x+5,y:this.y+4,w:this.w-10,h:this.h-4};}
    get feetY(){return this.y+this.h;}
}

class RadRoach{
    constructor(x,speedMult){
        this.x=x;this.y=GROUND-18;this.w=38;this.h=18;
        this.hp=20;this.maxHp=20;this.vx=-rand(2.5,4.2)*speedMult;

    }

    update(sm=1){
        if(this.squished){this.squishTimer++;if(this.squishTimer>40)this.dead=true;return;}
        this.x+=this.vx*sm;this.frame++;
        if(this.hitFlash>0)this.hitFlash--;
        if(this.x+this.w<-60)this.dead=true;

        if(this.squished)return;

        this.score=75;

        if(this.hitFlash>0&&Math.floor(this.hitFlash/2)%2===0)ctx.filter='brightness(5) saturate(0)';

// ── Pickle 3000 state ─────────────────────────────────────────────────────
let pickle3000Open=false,pickle3000Tab=0,pickle3000Sel=0,pickle3000Scroll=0;

const PICKLE_VISIBLE=5;
function sfxPickle3000(){
    try{
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(440,a.currentTime);
        o.frequency.setValueAtTime(660,a.currentTime+0.06);
        o.frequency.setValueAtTime(550,a.currentTime+0.13);

        o.start();o.stop(a.currentTime+0.22);
    }catch(e){}
}
function getPickleList(){
    if(pickle3000Tab===1)return WEAPONS.map((w,i)=>({label:w.label,desc:`DMG ${w.dmg}  SPD ${w.spd}${w.pellets>1?'  x'+w.pellets:''}`,cost:w.cost,owned:ownedWeapons.has(i),equipped:currentWeaponIdx===i,_idx:i}));
    if(pickle3000Tab===2)return CLOTHING_ITEMS.map((c,i)=>({label:c.label,desc:c.desc,cost:c.cost,owned:ownedClothing.has(c.id),equipped:false,_idx:i}));
    if(pickle3000Tab===3)return SHOP_ITEMS.filter(it=>it.weaponIdx===undefined).map((it,i)=>({label:it.label,desc:it.desc,cost:it.cost,owned:false,equipped:false,_idx:i}));
    return[];
}
function pickle3000Buy(){
    if(pickle3000Tab===0)return;
    const list=getPickleList();
    const entry=list[pickle3000Sel];if(!entry)return;
    if(pickle3000Tab===1){
        const wi=entry._idx;
        if(ownedWeapons.has(wi)){
            if(currentWeaponIdx===wi){pickle3000Msg='ALREADY EQUIPPED';}
            else{currentWeaponIdx=wi;sfxWeaponSwitch();pickle3000Msg='EQUIPPED: '+WEAPONS[wi].label;}
        }else if(caps>=WEAPONS[wi].cost){
            caps-=WEAPONS[wi].cost;ownedWeapons.add(wi);currentWeaponIdx=wi;
            pickle3000Msg='BOUGHT: '+WEAPONS[wi].label;sfxPickup();
        }else{pickle3000Msg='INSUFFICIENT CAPS';}
    }else if(pickle3000Tab===2){
        const item=CLOTHING_ITEMS[entry._idx];if(!item)return;
        if(ownedClothing.has(item.id)){pickle3000Msg='ALREADY OWNED';}
        else if(caps>=item.cost){
            caps-=item.cost;ownedClothing.add(item.id);item.apply();
            pickle3000Msg='BOUGHT: '+item.label;sfxPickup();
        }else{pickle3000Msg='INSUFFICIENT CAPS';}
    }else if(pickle3000Tab===3){
        const items=SHOP_ITEMS.filter(it=>it.weaponIdx===undefined);
        const item=items[entry._idx];if(!item)return;
        if(caps>=item.cost){
            caps-=item.cost;item.action();
            pickle3000Msg='USED: '+item.label;sfxPickup();
        }else{pickle3000Msg='INSUFFICIENT CAPS';}
    }
    pickle3000MsgTimer=90;
}

function sfxWeaponSwitch(){
    try{
        const a=ac(),o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.type='square';
        o.frequency.setValueAtTime(660,a.currentTime);
        o.frequency.setValueAtTime(990,a.currentTime+0.05);
        g.gain.setValueAtTime(0.1,a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.1);
        o.start();o.stop(a.currentTime+0.1);
    }catch(e){}
}

const SHOP_ITEMS = [

    { label:'STIMPAK',       desc:'+50 HP',              cost:30,  action:()=>{ player.hp=Math.min(player.maxHp,player.hp+50); } },
    { label:'NUKA-COLA',     desc:'FULL HEALTH RESTORE', cost:80,  action:()=>{ player.hp=player.maxHp; } },

];
function buyShopItem(i){
    const item=SHOP_ITEMS[i];
    if(!item)return;
    if(item.weaponIdx!==undefined&&ownedWeapons.has(item.weaponIdx)){
        vaultMsg='ALREADY OWNED!';vaultMsgTimer=80;return;
    }
    if(caps>=item.cost){
        caps-=item.cost;item.action();
        vaultMsg='BOUGHT: '+item.label+'!';vaultMsgTimer=120;sfxPickup();
    }else{
        vaultMsg='INSUFFICIENT CAPS';vaultMsgTimer=80;
    }
}

// ── V.A.T.S ────────────────────────────────────────────────────────────
const VATS_MAX_AP = 6;
let vats = {active:false,ap:VATS_MAX_AP,cooldown:0,queue:[],executing:false,execTimer:0};
function activateVATS(){
    if(vats.cooldown>0||vats.active||vats.executing)return;
    vats.active=true;vats.queue=[];vats.ap=VATS_MAX_AP;sfxVATS();
}
function executeVATS(){
    if(vats.queue.length===0){vats.active=false;return;}
    vats.active=false;vats.executing=true;vats.execTimer=0;sfxVATSExecute();
}
function drawVATSOverlay(ctx,enemies,vatsRef,frame){
    // Dark tinted overlay
    ctx.fillStyle='rgba(0,30,0,0.45)';ctx.fillRect(0,0,W,H);
    // Vignette
    const vg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,420);
    vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,60,0,0.55)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    // VATS title
    const blink=Math.floor(frame/15)%2;
    ctx.fillStyle=blink?'#00ff44':'#00cc33';
    ctx.font='bold 22px Courier New';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('V . A . T . S',W/2,48);
    ctx.font='11px Courier New';ctx.fillStyle='#3f3';
    ctx.fillText('SELECT TARGETS  ·  PRESS [1-5]  ·  [ENTER] TO EXECUTE  ·  [V/TAB] CANCEL',W/2,74);
    // AP display
    ctx.textAlign='left';
    ctx.fillStyle='#3f3';ctx.font='bold 12px Courier New';ctx.textBaseline='middle';
    ctx.fillText('AP:',10,H-56);
    for(let i=0;i<VATS_MAX_AP/2;i++){
        const filled=i*2<vatsRef.ap;
        ctx.fillStyle=filled?'#00ff44':'#1a3a1a';
        roundRect(ctx,40+i*22,H-64,18,16,3);ctx.fill();
        ctx.strokeStyle=filled?'#3f3':'#2a4a2a';ctx.lineWidth=1;
        roundRect(ctx,40+i*22,H-64,18,16,3);ctx.stroke();
    }
    // Draw target boxes on enemies
    const onScreen=enemies.filter(e=>!e.dead&&e.x>0&&e.x<W);
    onScreen.forEach((e,i)=>{
        const isQueued=vatsRef.queue.includes(e);
        const col=isQueued?'#ff4444':'#ffcc00';
        const r=e.rect;
        // Animated targeting box
        const cornerLen=8,off=Math.sin(frame*0.2)*2;
        ctx.strokeStyle=col;ctx.lineWidth=2;
        // Corners
        ctx.beginPath();ctx.moveTo(r.x-off,r.y-off+cornerLen);ctx.lineTo(r.x-off,r.y-off);ctx.lineTo(r.x-off+cornerLen,r.y-off);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r.x+r.w+off-cornerLen,r.y-off);ctx.lineTo(r.x+r.w+off,r.y-off);ctx.lineTo(r.x+r.w+off,r.y-off+cornerLen);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r.x-off,r.y+r.h+off-cornerLen);ctx.lineTo(r.x-off,r.y+r.h+off);ctx.lineTo(r.x-off+cornerLen,r.y+r.h+off);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r.x+r.w+off-cornerLen,r.y+r.h+off);ctx.lineTo(r.x+r.w+off,r.y+r.h+off);ctx.lineTo(r.x+r.w+off,r.y+r.h+off-cornerLen);ctx.stroke();
        // Number badge
        ctx.fillStyle='rgba(0,0,0,0.8)';roundRect(ctx,r.x+r.w/2-10,r.y-22,20,16,3);ctx.fill();
        ctx.fillStyle=col;ctx.font='bold 12px Courier New';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(i+1,r.x+r.w/2,r.y-14);
        // Hit chance
        const dist=Math.abs(e.cx-400)/400;
        const chance=Math.round((0.95-dist*0.3)*100);
        ctx.fillStyle='#3f3';ctx.font='9px Courier New';
        ctx.fillText(chance+'%',r.x+r.w/2,r.y-4);
        if(isQueued){
            ctx.fillStyle='rgba(255,0,0,0.15)';
            ctx.fillRect(r.x,r.y,r.w,r.h);
        }
    });
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ── Pickle 3000 (full-screen menu, open with P) ───────────────────────────
function drawPickle3000(ctx,player,enemies,score,caps,frame){
    const pw=490,ph=310;

    ctx.fillStyle=bodyG;
    roundRect(ctx,px,py,pw,ph,12);ctx.fill();
    ctx.strokeStyle='#52583a';ctx.lineWidth=2;

        ctx.fillStyle=kg;ctx.beginPath();ctx.arc(kx,ky,9,0,Math.PI*2);ctx.fill();
        const ka=ki*1.1-0.6+Math.sin(frame*0.003+ki)*0.04;

        ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(kx+Math.cos(ka)*6,ky+Math.sin(ka)*6);ctx.stroke();
        ctx.fillStyle=ki===0?'#00ff44':ki===1?'#ffcc00':'#ff4422';

    // Screen bezel
    const sx=px+14,sy=py+14,sw=pw-48,sh=ph-26;

    ctx.shadowColor='#00ff44';ctx.shadowBlur=12;
    ctx.strokeStyle='#00cc33';ctx.lineWidth=1;roundRect(ctx,sx,sy,sw,sh,5);ctx.stroke();
    ctx.shadowBlur=0;
    for(let sl=sy+1;sl<sy+sh;sl+=2){ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(sx+1,sl,sw-2,1);}
    ctx.globalAlpha=0.06;
    const glr=ctx.createLinearGradient(sx,sy,sx+sw*0.6,sy+sh*0.4);
    glr.addColorStop(0,'#ffffff');glr.addColorStop(1,'transparent');
    ctx.fillStyle=glr;roundRect(ctx,sx,sy,sw,sh,5);ctx.fill();
    ctx.globalAlpha=1;

    // Screen content (clipped)
    ctx.save();ctx.beginPath();roundRect(ctx,sx+1,sy+1,sw-2,sh-2,4);ctx.clip();

    // Header
    ctx.fillStyle='rgba(0,100,0,0.85)';ctx.fillRect(sx,sy,sw,18);
    ctx.fillStyle='#00ff88';ctx.font='bold 11px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PICKLE  3000',sx+sw/2,sy+9);
    ctx.fillStyle='#ffcc00';ctx.font='bold 9px Courier New';ctx.textAlign='right';
    ctx.fillText(`◈ ${caps}`,sx+sw-6,sy+9);

    // Tabs: STAT | WEAP | CLTH | ITEM
    const tabW=sw/4;
    tabs.forEach((t,ti)=>{

        ctx.fillStyle=active?'rgba(0,155,0,0.75)':'rgba(0,40,0,0.4)';ctx.fillRect(tx,sy+19,tabW-1,14);

    ctx.strokeStyle='#006622';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(sx+4,sy+34);ctx.lineTo(sx+sw-4,sy+34);ctx.stroke();

    // Content area

        const wpn=WEAPONS[currentWeaponIdx];

        ctx.fillStyle='#448844';ctx.fillText('WPN',sx+6,row);
        ctx.fillStyle='#00ff88';ctx.fillText(wpn.label,sx+36,row);row+=lh;
        ctx.fillStyle='#448844';ctx.fillText('DMG',sx+6,row);
        ctx.fillStyle='#00ff88';ctx.fillText(`${wpn.dmg}${wpn.pellets>1?' x'+wpn.pellets:''}`,sx+36,row);
        ctx.fillStyle='#448844';ctx.fillText('SPD',sx+sw/2,row);
        ctx.fillStyle='#00ff88';ctx.fillText(`${wpn.spd}`,sx+sw/2+30,row);row+=lh;
        const onScreen=enemies.filter(e=>!e.dead&&!e.squished&&e.x>0&&e.x<W).length;
        ctx.fillStyle='#448844';ctx.fillText('ENMY',sx+6,row);
        ctx.fillStyle=onScreen>0?'#ff5533':'#00ff88';ctx.fillText(`${onScreen} DETECTED`,sx+36,row);row+=lh;
        ctx.fillStyle='#448844';ctx.fillText('CAPS',sx+6,row);
        ctx.fillStyle='#ffcc00';ctx.fillText(`${caps}`,sx+36,row);
        ctx.fillStyle='#448844';ctx.fillText('SCORE',sx+sw/2,row);
        ctx.fillStyle='#00ff88';ctx.fillText(`${score}`,sx+sw/2+40,row);row+=lh;
        if(ownedClothing.size>0){
            ctx.fillStyle='#448844';ctx.fillText('GEAR',sx+6,row);
            ctx.fillStyle='#88cc88';ctx.font='8px Courier New';
            ctx.fillText(CLOTHING_ITEMS.filter(c=>ownedClothing.has(c.id)).map(c=>c.label).join(' + '),sx+36,row+1);

    } else {
        // ── WEAP / CLTH / ITEM list ───────────────────────────────────────
        const list=getPickleList();
        pickle3000Scroll=Math.max(0,Math.min(pickle3000Scroll,Math.max(0,list.length-PICKLE_VISIBLE)));
        for(let i=0;i<Math.min(PICKLE_VISIBLE,list.length-pickle3000Scroll);i++){
            const li=i+pickle3000Scroll,entry=list[li];

    ctx.fillStyle='#ffaa55';ctx.font='bold 64px Courier New';ctx.fillText('RAIDER RUNNER',W/2,H/2-64);
    ctx.shadowBlur=0;
    ctx.fillStyle='#33ff33';ctx.font='15px Courier New';ctx.fillText('☢  SURVIVE THE WASTELAND  ☢',W/2,H/2-12);
    ctx.fillStyle='#aaaaaa';ctx.font='13px Courier New';
    ctx.fillText('ARROW KEYS  ·  MOVE / JUMP / CROUCH',W/2,H/2+26);
    ctx.fillText('Z / CTRL  ·  SHOOT       V / TAB  ·  V.A.T.S',W/2,H/2+46);
    ctx.fillText('JUMP ON ROACHES TO SQUISH  ·  ENTER VAULT FOR SAFETY',W/2,H/2+66);
    ctx.fillStyle='#cc6600';ctx.font='12px Courier New';
    ctx.fillText('ENEMIES:   RAD ROACHES   ·   MALL RATS   ·   RAIDERS',W/2,H/2+94);
    if(Math.floor(Date.now()/520)%2===0){
        ctx.fillStyle='#33ff33';ctx.font='bold 17px Courier New';
        ctx.fillText(isTouchDevice()?'[ TAP ANYWHERE TO START ]':'[ PRESS SPACE TO START ]',W/2,H/2+130);
    }
    ctx.fillStyle='#333';ctx.font='10px Courier New';
    ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('v0.2 PROTOTYPE',W-8,H-4);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawDead(ctx,score,highScore,isNew){
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#cc0000';ctx.shadowBlur=45;
    ctx.fillStyle='#ff0000';ctx.font='bold 68px Courier New';ctx.fillText('YOU DIED',W/2,H/2-68);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffcc00';ctx.font='bold 26px Courier New';ctx.fillText(`SCORE: ${score}`,W/2,H/2-4);
    if(isNew&&score>0){ctx.fillStyle='#ff6600';ctx.font='16px Courier New';ctx.fillText('☆  NEW HIGH SCORE  ☆',W/2,H/2+28);}
    ctx.fillStyle='#777';ctx.font='14px Courier New';ctx.fillText(`BEST: ${highScore}`,W/2,H/2+58);
    if(Math.floor(Date.now()/520)%2===0){
        ctx.fillStyle='#33ff33';ctx.font='bold 16px Courier New';
        ctx.fillText('[ PRESS SPACE  or  R  TO TRY AGAIN ]',W/2,H/2+100);
    }
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ── Game state ─────────────────────────────────────────────────────────
let state='title'; // title | playing | vault | dead
let player,enemies,bullets,particles,pickups,vaultDoors,squishDecals;
let scroll=0,score=0,highScore=0;
let spawnTimer=0,diffTick=0,gameFrame=0;
let vaultSpawnCD=0;
let pickupSpawnCD=rInt(600,1200);
let worldSpeedMult=1.0; // slows down when vault approaches
let caps=0,vaultMsg='',vaultMsgTimer=0,vaultSelected=0,vaultScrollOffset=0;

function initGame(){
    player=new Player();
    enemies=[];bullets=[];particles=[];pickups=[];vaultDoors=[];squishDecals=[];
    scroll=0;score=0;spawnTimer=0;diffTick=0;gameFrame=0;
    vaultSpawnCD=1800;pickupSpawnCD=rInt(600,1200);
    silencerTicks=0;worldSpeedMult=1.0;
    caps=0;vaultMsg='';vaultMsgTimer=0;vaultSelected=0;vaultScrollOffset=0;
    currentWeaponIdx=0;ownedWeapons=new Set([0]);
    vats={active:false,ap:VATS_MAX_AP,cooldown:0,queue:[],executing:false,execTimer:0};
}

function spawnEnemy(){
    const dt=diffTick;
    let weights;
    if(dt>5400)weights=[1,2,3];
    else if(dt>3600)weights=[2,2,2];
    else if(dt>1800)weights=[3,2,1];
    else weights=[5,2,0];
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total,idx=0;
    for(;idx<weights.length-1;idx++){r-=weights[idx];if(r<=0)break;}
    const sm=getSpeedMult(dt),x=W+50;
    if(idx===0)enemies.push(new RadRoach(x,sm));
    else if(idx===1)enemies.push(new MallRat(x,sm));
    else enemies.push(new Raider(x,sm));
}

// ── Main loop ──────────────────────────────────────────────────────────
function update(){
    pollGamepad();
    gameFrame++;
    if(state==='title'){
        if(pressed['Space']||pressed['Enter']){state='playing';initGame();}
        for(const k in pressed)delete pressed[k];return;
    }
    if(state==='dead'){
        if(pressed['Space']||pressed['Enter']||pressed['KeyR']){state='playing';initGame();}
        for(const k in pressed)delete pressed[k];return;
    }
    if(state==='vault'){
        if(vaultMsgTimer>0)vaultMsgTimer--;
        if(pressed['ArrowUp']||pressed['KeyW']){
            vaultSelected=(vaultSelected-1+SHOP_ITEMS.length)%SHOP_ITEMS.length;
            if(vaultSelected<vaultScrollOffset)vaultScrollOffset=vaultSelected;
            if(vaultScrollOffset>Math.max(0,SHOP_ITEMS.length-VAULT_ITEMS_VISIBLE))vaultScrollOffset=Math.max(0,SHOP_ITEMS.length-VAULT_ITEMS_VISIBLE);
        }
        if(pressed['ArrowDown']||pressed['KeyS']){
            vaultSelected=(vaultSelected+1)%SHOP_ITEMS.length;
            if(vaultSelected>=vaultScrollOffset+VAULT_ITEMS_VISIBLE)vaultScrollOffset=vaultSelected-VAULT_ITEMS_VISIBLE+1;
            if(vaultScrollOffset<0)vaultScrollOffset=0;
        }
        for(let i=0;i<SHOP_ITEMS.length;i++) if(pressed[`Digit${i+1}`]) buyShopItem(i);
        if(pressed['Enter']||pressed['Space']) buyShopItem(vaultSelected);
        if(pressed['Escape']||pressed['KeyE']||pressed['KeyB']){state='playing';}
        for(const k in pressed)delete pressed[k];return;
    }

    // ── Playing ──────────────────────────────────────────────────────
    // Pickle 3000 open/close
    if(pressed['KeyP']&&!pickle3000Open){
        pickle3000Open=true;pickle3000Tab=0;pickle3000Sel=0;pickle3000Scroll=0;
        sfxPickle3000();
        for(const k in pressed)delete pressed[k];
    }
    // While Pickle 3000 menu is open: handle navigation and freeze gameplay
    if(pickle3000Open){
        if(pickle3000MsgTimer>0)pickle3000MsgTimer--;
        const list=pickle3000Tab>0?getPickleList():[];
        if(pressed['ArrowLeft']||pressed['KeyA']){
            pickle3000Tab=(pickle3000Tab-1+4)%4;pickle3000Sel=0;pickle3000Scroll=0;
        }
        if(pressed['ArrowRight']||pressed['KeyD']){
            pickle3000Tab=(pickle3000Tab+1)%4;pickle3000Sel=0;pickle3000Scroll=0;
        }
        if(pickle3000Tab>0&&list.length>0){
            if(pressed['ArrowUp']||pressed['KeyW']){
                pickle3000Sel=Math.max(0,pickle3000Sel-1);
                if(pickle3000Sel<pickle3000Scroll)pickle3000Scroll=pickle3000Sel;
            }
            if(pressed['ArrowDown']||pressed['KeyS']){
                pickle3000Sel=Math.min(list.length-1,pickle3000Sel+1);
                if(pickle3000Sel>=pickle3000Scroll+PICKLE_VISIBLE)pickle3000Scroll=pickle3000Sel-PICKLE_VISIBLE+1;
            }
            if(pressed['Enter']||pressed['Space']||pressed['KeyZ'])pickle3000Buy();
        }
        if(pressed['Escape']||pressed['KeyP']){pickle3000Open=false;sfxPickle3000();}
        for(const k in pressed)delete pressed[k];
        return; // freeze all gameplay while menu is open
    }

    const frozen=vats.active;

    // Vault approach: lerp world speed down to 0.22 when vault is on screen
    const vaultOnScreen = vaultDoors.length > 0 && vaultDoors.some(v => v.x < W + 20 && v.x > -100);
    const targetSpeed = vaultOnScreen ? 0.22 : 1.0;
    worldSpeedMult += (targetSpeed - worldSpeedMult) * 0.035;
    if(Math.abs(worldSpeedMult - targetSpeed) < 0.001) worldSpeedMult = targetSpeed;

    if(!frozen){
        scroll += 3 * worldSpeedMult;
        diffTick++;
        spawnTimer += worldSpeedMult;
        if(silencerTicks>0)silencerTicks--;
    }

    // Spawn enemies
    if(!frozen){
        const spawnInterval=getSpawnInterval(diffTick);
        const maxEnemies=getMaxEnemies(diffTick);
        if(spawnTimer>=spawnInterval){
            spawnTimer=0;
            if(enemies.filter(e=>!e.squished).length<maxEnemies)spawnEnemy();
        }
    }

    // Spawn vault door
    if(!frozen){
        vaultSpawnCD--;
        if(vaultSpawnCD<=0&&vaultDoors.length===0){
            vaultDoors.push(new VaultDoorProp());
            vaultSpawnCD=rInt(2400,3600);
        }
    }

    // Spawn silencer pickups
    if(!frozen){
        pickupSpawnCD--;
        if(pickupSpawnCD<=0&&pickups.length===0){
            pickups.push(new SilencerPickup(W+40));
            pickupSpawnCD=rInt(800,1600);
        }
    }

    // VATS: toggle
    if((pressed['KeyV']||pressed['Tab'])&&!vats.executing){
        if(vats.active){vats.active=false;}
        else if(vats.cooldown<=0){activateVATS();}
    }
    if(vats.active&&(pressed['Enter']||pressed['NumpadEnter'])){executeVATS();}

    // VATS: number key targeting
    if(vats.active){
        const onScreen=enemies.filter(e=>!e.dead&&!e.squished&&e.x>0&&e.x<W);
        for(let i=0;i<Math.min(5,onScreen.length);i++){
            const code=`Digit${i+1}`;
            if(pressed[code]&&vats.ap>=2){
                const e=onScreen[i];
                if(!vats.queue.includes(e)){
                    vats.queue.push(e);vats.ap-=2;
                }
            }
        }
    }

    // Weapon cycle (Q key or LB)
    if(pressed['KeyQ']&&!frozen){
        const owned=Array.from(ownedWeapons).sort((a,b)=>a-b);
        const ci=owned.indexOf(currentWeaponIdx);
        currentWeaponIdx=owned[(ci+1)%owned.length];
        sfxWeaponSwitch();
    }

    // VATS cooldown tick
    if(!frozen&&vats.cooldown>0)vats.cooldown--;

    // VATS execution
    if(vats.executing){
        vats.execTimer++;
        if(vats.execTimer>=22){
            vats.execTimer=0;
            if(vats.queue.length>0){
                const target=vats.queue.shift();
                if(target&&!target.dead&&!target.squished){
                    sfxShoot();
                    target.takeDamage(50,particles);
                    if(target.dead){score+=target.score;caps+=capsDrop(target);}
                    addShake(4);
                    // Bullet trail effect
                    bullets.push(new Bullet(player.cx+(player.facing===1?20:-20),player.cy-10,player.facing===1?15:-15,'player'));
                }
            }
            if(vats.queue.length===0){vats.executing=false;vats.cooldown=300;}
        }
    }

    // Update player (only when not frozen / executing)
    if(!frozen&&!vats.executing)player.update(bullets);
    else if(vats.executing)player.update(bullets); // let player still shoot

    // Update bullets
    for(const b of bullets)b.update();

    // Update enemies (frozen in VATS)
    if(!frozen){
        for(const e of enemies){
            if(e.type==='mallrat')e.update(player,worldSpeedMult);
            else if(e.type==='raider')e.update(bullets,worldSpeedMult);
            else e.update(worldSpeedMult);
        }
    }

    // Update vault doors and pickups
    if(!frozen){
        for(const v of vaultDoors)v.update(player,worldSpeedMult);
        for(const p of pickups)p.update(worldSpeedMult);
    }

    for(const p of particles)p.update();

    // ── Stomp: player falls onto radroach top ─────────────────────────
    if(player.vy>2){
        for(const e of enemies){
            if(e.type==='radroach'&&!e.squished&&!e.dead){
                const pr=player.rect;
                const horizOverlap=pr.x<e.x+e.w-4&&pr.x+pr.w>e.x+4;
                const vertHit=player.feetY>=e.topY&&player.feetY<=e.topY+e.h+4;
                if(horizOverlap&&vertHit){
                    e.squish(particles);
                    score+=e.score;caps+=capsDrop(e);
                    player.vy=-9; // bounce
                    addShake(4);
                }
            }
        }
    }

    // ── Collision: bullets ────────────────────────────────────────────
    const pr=player.rect;
    for(const b of bullets){
        if(b.dead)continue;
        if(b.owner==='player'){
            for(const e of enemies){
                if(!e.dead&&!e.squished&&overlap(b.rect,e.rect)){
                    b.dead=true;
                    e.takeDamage(WEAPONS[currentWeaponIdx].dmg,particles);
                    if(e.dead){score+=e.score;caps+=capsDrop(e);}
                    for(let i=0;i<6;i++)particles.push(new Particle(b.x,b.y,rand(-4,4),rand(-4,0),'#ffcc00',rInt(10,20),3));
                    break;
                }
            }
        }else{
            if(overlap(b.rect,pr)){
                b.dead=true;player.takeDamage(6,particles);addShake(3);
            }
        }
    }

    // ── Collision: enemy contact ──────────────────────────────────────
    for(const e of enemies){
        if(!e.dead&&!e.squished&&overlap(pr,e.rect)){
            const dmg=e.type==='mallrat'?18:e.type==='raider'?10:7;
            player.takeDamage(dmg,particles);
            if(e.type!=='radroach')e.dead=true;
            addShake(5);
            for(let i=0;i<10;i++)particles.push(new Particle(player.cx,player.cy,rand(-6,6),rand(-5,2),'#ff4400',rInt(20,38)));
        }
    }

    // ── Pickup collection ─────────────────────────────────────────────
    for(const p of pickups){
        if(overlap(pr,p.rect)){
            p.dead=true;silencerTicks=600;sfxPickup();
        }
    }

    // ── Vault entry ───────────────────────────────────────────────────
    for(const v of vaultDoors){
        if(v.interactive&&(pressed['ArrowUp']||pressed['KeyW']||pressed['KeyE']||pressed['Space']||pressed['Enter'])){
            player.hp=player.maxHp;state='vault';v.dead=true;break;
        }
    }

    // Clean up
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!(e.dead&&!e.squished)&&!((e.squished)&&e.squishTimer>40));
    particles=particles.filter(p=>p.alive);
    pickups=pickups.filter(p=>!p.dead);
    vaultDoors=vaultDoors.filter(v=>!v.dead);

    if(player.dead){
        if(!player.deathSoundPlayed){sfxDie();player.deathSoundPlayed=true;}
        highScore=Math.max(highScore,score);state='dead';pickle3000Open=false;
    }

    tickShake();
    for(const k in pressed)delete pressed[k];
}

function draw(){
    ctx.save();
    ctx.translate(Math.round(shakeX),Math.round(shakeY));

    if(state==='vault'){
        drawVaultInterior(ctx,gameFrame);
        // Mobile: show a large EXIT tap target
        if(isTouchDevice()){
            ctx.save();
            ctx.globalAlpha=0.7;
            ctx.fillStyle='rgba(0,0,0,0.6)';ctx.strokeStyle='#3f3';ctx.lineWidth=1.5;
            roundRect(ctx,8,GROUND-96,60,96,4);ctx.fill();ctx.stroke();
            ctx.fillStyle='#3f3';ctx.font='bold 10px Courier New';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('TAP',38,GROUND-54);ctx.fillText('EXIT',38,GROUND-38);
            ctx.globalAlpha=1;ctx.restore();
        }
        ctx.restore();return;
    }

    if(state==='playing'||state==='dead'){
        drawBG(ctx,scroll);
        // Vault doors (behind enemies)
        for(const v of vaultDoors)v.draw(ctx);
        // Particles
        for(const p of particles)p.draw(ctx);
        // Enemies
        for(const e of enemies)e.draw(ctx);
        // Pickups
        for(const p of pickups)p.draw(ctx);
        // Player
        player.draw(ctx);
        // Bullets
        for(const b of bullets)b.draw(ctx);
        // Vault approach slow-down overlay
        if(worldSpeedMult < 0.98){
            const t = 1 - (worldSpeedMult - 0.22) / 0.78; // 0 = normal, 1 = fully slowed
            // Green edge vignette
            const vg = ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,440);
            vg.addColorStop(0,'transparent');
            vg.addColorStop(1,`rgba(0,80,20,${t*0.55})`);
            ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
            // "VAULT AHEAD" banner
            if(t > 0.15){
                ctx.save();
                ctx.globalAlpha = Math.min(1, (t-0.15)/0.3);
                ctx.fillStyle='rgba(0,0,0,0.6)';
                ctx.fillRect(W/2-130,H/2-56,260,34);
                ctx.strokeStyle='#00ff66'; ctx.lineWidth=1;
                ctx.strokeRect(W/2-130,H/2-56,260,34);
                ctx.fillStyle='#00ff66';
                ctx.font='bold 16px Courier New';
                ctx.textAlign='center'; ctx.textBaseline='middle';
                const blink = Math.floor(gameFrame/20)%2;
                if(blink) ctx.fillText('► VAULT AHEAD — APPROACH TO ENTER ◄', W/2, H/2-39);
                ctx.globalAlpha=1; ctx.restore();
            }
        }
        // VATS overlay (on top of scene, before HUD)
        if(vats.active)drawVATSOverlay(ctx,enemies,vats,gameFrame);
        // HUD
        drawHUD(ctx,player,score,highScore,diffTick,vats,silencerTicks,gameFrame,caps);
        if(pickle3000Open)drawPickle3000(ctx,player,enemies,score,caps,gameFrame);
        if(state==='dead')drawDead(ctx,score,highScore,score>=highScore);
        const vi = vaultDoors.some(v=>v.interactive);
        drawTouchControls(ctx, vi);
    }else{
        drawTitle(ctx);
        drawTouchControls(ctx, false);
    }

    ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
